<div class="login-container">

  <div class="login-card">

    <h1>Employee Verification System</h1>

    <input
      type="email"
      placeholder="Email"
      [(ngModel)]="email">

    <input
      type="password"
      placeholder="Password"
      [(ngModel)]="password">

    <select [(ngModel)]="role">

      <option value="General User">
        General User
      </option>

      <option value="Admin">
        Admin
      </option>

    </select>

    <button (click)="login()">
      Login
    </button>

    <p>

      New User?

      <a routerLink="/signup">
        Sign Up
      </a>

    </p>

  </div>

</div>
