<div class="login-container">

  <div class="login-card">

    <h1>Create Account</h1>

    <input
      type="text"
      placeholder="Name"
      [(ngModel)]="name">

    <input
      type="email"
      placeholder="Email"
      [(ngModel)]="email">

    <input
      type="password"
      placeholder="Password"
      [(ngModel)]="password">

    <select [(ngModel)]="role">

      <option value="General User">
        General User
      </option>

      <option value="Admin">
        Admin
      </option>

    </select>

    <button (click)="signup()">
      Sign Up
    </button>

  </div>

</div>
